services:
  app:
    hostname: 2pptx
    image: 2pptx:main
    build: .
    init: true
    ports:
      - "${PORT:-9090}:5000"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 96M
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-100}"
      MAX_FILES: "${MAX_FILES:-250}"
      MAX_PDF_PAGES: "${MAX_PDF_PAGES:-250}"
      MAX_SLIDES: "${MAX_SLIDES:-250}"
    networks:
      - nginx_proxy_net

networks:
  nginx_proxy_net:
    external: true
