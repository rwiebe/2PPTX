name: Conversion checks
on:
  pull_request:
  push:
    branches: [main, agent/harden-conversion-service]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt pip-audit
      - run: pytest
      - run: python -m compileall -q app.py tests scripts
      - run: node --check static/js/script.js
      - run: pip-audit -r requirements.txt
      - run: docker compose config --quiet
      - run: docker network create nginx_proxy_net
      - run: docker compose up --build --wait --wait-timeout 120
      - name: Verify container configuration
        run: |
          id=$(docker compose ps -q app)
          test "$(docker inspect -f '{{.Config.User}}' "$id")" = app
          test "$(docker inspect -f '{{.HostConfig.Memory}}' "$id")" -eq 536870912
          test "$(docker inspect -f '{{.State.Health.Status}}' "$id")" = healthy
      - run: python scripts/http_smoke.py
      - name: Verify output cleanup
        run: |
          sleep 1
          docker compose exec -T app python -c "from pathlib import Path; assert not list(Path('/tmp').glob('*.pptx'))"
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Cleanup
        if: always()
        run: docker compose down
