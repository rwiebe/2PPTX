<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPTX Konverter</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/efk-logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="hero">
        <img src="{{ url_for('static', filename='img/efk-logo.png') }}" alt="Logo der EFK Bünde" class="logo">
        <div class="hero-text">
            <h1>EFK PPTX Konverter</h1>
            <p>PDFs und Bilder in professionelle Präsentationen umwandeln</p>
        </div>
    </header>

    <div class="container">
        <form id="upload-form">
            <div id="drop-zone">
                <p>Dateien hierher ziehen oder</p>
                <input type="file" id="file-input" name="files" multiple accept=".png,.jpg,.jpeg,.gif,.bmp,.tiff,.pdf">
                <label for="file-input" class="file-button">Dateien auswählen</label>
            </div>
            <ul id="file-list"></ul>
            <button type="submit" id="submit-button" disabled>PPTX erstellen & Herunterladen</button>
        </form>
        <div id="status" role="status" aria-live="polite"></div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
